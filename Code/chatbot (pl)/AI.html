<!DOCTYPE html>
<html lang="pl-PL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own AI</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: monospace;
            border-radius: 15px;
        }

        body {
            background: linear-gradient(#9198e5);
        }

        main {
            position: relative;
            height: 90vh;
            width: 95vw;
            left: 2.5vw;
            top: 4.5vh;
            background-color: beige;
            border: 3px solid gray;
            box-shadow: 0 0 50px rgba(172, 55, 255);
        }

        #top {
            position: relative;
            top: 0;
            left: 0;
            height: 87%;
            width: 100%;
            background-color: azure;
            overflow-y: auto;
        }

        #bottom {
            position: relative;
            bottom: 0;
            left: 13px;
            height: 13%;
            width: 99%;
            background-color: aliceblue;
            padding: 5px 0;
        }

        ul {
            display: flex;
            flex-direction: row;
            gap: 7px;
            list-style-type: none;
            margin-left: -30px;
            position: relative;
            top: -10px;
        }

        .polishSigns {
            width: 35px;
            height: 35px;
            font-size: x-large;
            cursor: pointer;
            padding: 0;
            transition: background-color 0.45s ease;
            border: 2px solid black;
        }

        #inputPlace {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 70px;
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin: -3px 0;
        }

        #input {
            position: relative;
            bottom: 20px;
            width: 91%;
            height: 100%;
            border: none;
            font-size: x-large;
            text-align: center;
            transition: background-color 0.45s ease;
            overflow-wrap: break-word;
            resize: none;
            border: 2px solid black;
        }

        #input:hover {
            background-color: rgba(179, 179, 179, 0.3);
        }

        #send {
            position: relative;
            bottom: 20px;
            left: 0;
            width: 7%;
            height: 70px;
            font-size: xx-large;
            cursor: pointer;
            transition: background-color 0.45s ease;
            border: 2px solid black;
        }

        button:hover {
            background-color: rgba(128, 0, 128, 60%);
        }

        @media (max-width: 1800px) {
            ul {
                top: -40px;
            }

            #inputPlace {
                height: 65px;
            }
        }
    </style>
</head>

<body>
    <h1 style="margin: 0;position:absolute;left: 50%;transform:translate(-50%);">Hercules</h1>
    <main>
        <section id="top"></section>
        <section id="bottom">
            <ul>
                <li>
                    <button class="polishSigns">ą</button>
                </li>
                <li>
                    <button class="polishSigns">ć</button>
                </li>
                <li>
                    <button class="polishSigns">ę</button>
                </li>
                <li>
                    <button class="polishSigns">ł</button>
                </li>
                <li>
                    <button class="polishSigns">ń</button>
                </li>
                <li>
                    <button class="polishSigns">ó</button>
                </li>
                <li>
                    <button class="polishSigns">ś</button>
                </li>
                <li>
                    <button class="polishSigns">ż</button>
                </li>
                <li>
                    <button class="polishSigns">ź</button>
                </li>
            </ul>
            <div id="inputPlace">
                <textarea placeholder="Wpisz coś" id="input"></textarea>
                <button id="send">↑</button>
            </div>
        </section>
    </main>
    <script type="module" src="AI.js"></script>
</body>

</html>
