<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Own AI</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: monospace;
            border-radius: 15px;
        }

        body {
            background: linear-gradient(#9198e5);
        }

        main {
            position: relative;
            height: 90vh;
            width: 95vw;
            left: 2.5vw;
            top: 4.5vh;
            background-color: beige;
            border: 3px solid gray;
            box-shadow: 0 0 50px rgba(172, 55, 255);
        }

        #top {
            position: relative;
            top: 0;
            left: 0;
            height: 87%;
            width: 100%;
            background-color: azure;
            overflow-y: auto;
        }

        #bottom {
            position: relative;
            bottom: 0;
            left: 13px;
            height: 13%;
            width: 99%;
            background-color: aliceblue;
            padding: 5px 0;
        }

        #inputPlace {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 70px;
            width: 100%;
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin: -3px 0;
        }

        #input {
            position: relative;
            bottom: 20px;
            width: 91%;
            height: 72px;
            border: none;
            font-size: x-large;
            text-align: center;
            transition: background-color 0.45s ease;
            overflow-wrap: break-word;
            resize: none;
            border: 2px solid black;
        }

        #input:hover {
            background-color: rgba(179, 179, 179, 0.3);
        }

        button {
            position: relative;
            bottom: 20px;
            left: 0;
            width: 7%;
            height: 70px;
            border: none;
            font-size: xx-large;
            cursor: pointer;
            transition: background-color 0.45s ease;
            border: 2px solid black;
        }

        button:hover {
            background-color: rgba(128, 0, 128, 0.81);
        }
    </style>
</head>

<body>
    <h1 style="margin: 0;position:absolute;left: 50%;transform:translate(-50%);">Hercules</h1>
    <main>
        <section id="top"></section>
        <section id="bottom">
            <div id="inputPlace">
                <textarea placeholder="Wpisz coś"
                    id="input"></textarea>
                <button>↑</button>
            </div>
        </section>
    </main>
    <script type="module" src="AI.js"></script>
    <script type="module" src="AI.mjs"></script>
</body>

</html>
